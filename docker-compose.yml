services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oven
      POSTGRES_PASSWORD: oven
      POSTGRES_DB: oven
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oven
      MINIO_ROOT_PASSWORD: ovenoven
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
